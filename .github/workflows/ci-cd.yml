name: DevOps Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Tests automatiques
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Installer les dependances
        run: pip install -r app/requirements.txt
      - name: Lancer les tests
        run: python -m pytest tests/ -v

  build:
    name: Build et Push Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Login DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Build et Push
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t ${{ secrets.DOCKER_USERNAME }}/devops-app:$IMAGE_TAG .
          docker push ${{ secrets.DOCKER_USERNAME }}/devops-app:$IMAGE_TAG

  deploy:
    name: Deploy Kubernetes
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config

      - name: Update image
        run: |
          kubectl set image deployment/flask-app \
          flask-app=${{ secrets.DOCKER_USERNAME }}/devops-app:${{ github.sha }}

      - name: Verify rollout
        run: kubectl rollout status deployment/flask-app